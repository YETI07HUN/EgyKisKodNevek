<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arena.io</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161a24;color:#e8ecf5;font:15px system-ui,sans-serif;overflow:hidden}
#menu,#lobby{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;overflow:auto}
#lobby,#game{display:none}
.card{background:#1f2533;border:1px solid #2f3750;border-radius:12px;padding:16px;width:min(520px,100%)}
h1{margin:8px 0;color:#4da3ff}h3{margin:0 0 10px}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #3a4460;background:#12151f;color:inherit}
button{background:#4da3ff;color:#06101f;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.row>input{flex:1;min-width:0}
.r{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid #2a3248}.r b{flex:1}.r i{color:#8d97b3}
.p{padding:6px 10px;margin:4px 0;border-left:4px solid #888;background:#12151f;border-radius:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#game canvas{display:block;cursor:crosshair}
</style></head><body>
<div id="menu">
 <h1>🎯 Arena.io</h1>
 <div class="card"><h3>Becenév</h3><input id="nick" maxlength="14" placeholder="Becenév" style="width:100%"></div>
 <div class="card"><h3>Szoba hosztolása</h3>
  <div class="row"><input id="rname" maxlength="24" placeholder="Szoba neve">
  <select id="rmode"><option value="ffa">FFA</option><option value="team">Csapat 3v3</option></select>
  <button onclick="host()">Létrehozás</button></div></div>
 <div class="card"><h3>Nyilvános szobák</h3><div id="rl"></div></div>
 <p style="color:#8d97b3">WASD – mozgás · egér – célzás · bal klikk – lövés</p>
</div>
<div id="lobby">
 <h1 id="lt"></h1>
 <div class="card"><div id="lp"></div><div id="note" style="color:#ffd24d;margin:8px 0"></div>
  <div class="row"><button id="sw" onclick="swap()">Csapatváltás</button>
  <button id="start" onclick="startReq()">Játék indítása</button>
  <button onclick="leave()" style="background:#ff5d5d">Kilépés</button></div>
  <div id="hint" style="color:#8d97b3"></div></div>
</div>
<div id="game"><canvas id="cv"></canvas></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== ÁLLÍTSD BE: Supabase > Project Settings > API ======
const SUPABASE_URL='https://caiqxmozigmqqwzhrmfw.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhaXF4bW96aWdtcXF3emhybWZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNjk3MDcsImV4cCI6MjExMDY0NTcwN30.wssv9zRfvV6v-ziaR5rFYH3o2nqVE6zY9v1apFqZSF8';
// ===========================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const me=localStorage.pid||(localStorage.pid=crypto.randomUUID());
$('nick').value=localStorage.nick||'';
const W=1600,H=1200,TICK=.033;
const walls=[[300,250,200,40],[1100,250,40,200],[700,550,200,100],[250,850,40,200],[1000,900,250,40],[700,150,200,30],[700,1000,200,30],[100,550,30,100],[1470,550,30,100]];
let room,isHost,hb,pi,ch,G,mode,note='',meI=-1,R=null,D=[],B=[],P=[],SB=[],simI,inI,raf,tk=0,over=0;
const inp={u:0,d:0,l:0,r:0,f:0,a:0};

function show(id){['menu','lobby','game'].forEach(s=>$(s).style.display=s==id?(s=='game'?'block':'flex'):'none')}
const nick=()=>{const n=$('nick').value.trim()||'Játékos'+Math.floor(Math.random()*900+100);localStorage.nick=n;return n};

// ---------- Szobalista ----------
async function lst(){
 const {data,error}=await sb.from('rooms').select('id,name,mode,room_players(last_seen)').eq('status','lobby').gt('updated_at',new Date(Date.now()-25000).toISOString());
 if(error){$('rl').innerHTML='<p style="color:#ff5d5d">Hiba: '+esc(error.message)+'</p>';return}
 $('rl').innerHTML=(data||[]).map(r=>{const n=r.room_players.filter(p=>Date.now()-new Date(p.last_seen)<25000).length;
  return `<div class=r><b>${esc(r.name)}</b><i>${r.mode=='ffa'?'FFA':'Csapat'}</i><span>${n}/6</span><button ${n>=6?'disabled':''} onclick="join('${r.id}')">Belépés</button></div>`}).join('')||'<p style="color:#8d97b3">Nincs nyilvános szoba – hosztolj egyet!</p>';
}
setInterval(()=>{if(!room)lst()},2000);lst();

async function host(){
 const {data,error}=await sb.rpc('create_room',{p_name:$('rname').value||nick()+' szobája',p_mode:$('rmode').value,p_host:me,p_nick:nick()});
 if(error)return alert(error.message);enter(data,true);
}
async function join(id){
 const {error}=await sb.rpc('join_room',{p_room:id,p_player:me,p_nick:nick()});
 if(error)return alert(error.message);enter(id,false);
}
function enter(id,h){
 room=id;isHost=h;note='';show('lobby');
 const beat=()=>sb.rpc('heartbeat',{p_room:room,p_player:me}).then(()=>{});
 hb=setInterval(beat,5000);pi=setInterval(poll,1000);poll();
}
async function leave(m){
 const r=room;room=null;clearInterval(hb);clearInterval(pi);stopGame();
 if(r)await sb.rpc('leave_room',{p_room:r,p_player:me});
 show('menu');if(m)alert(m);lst();
}

// ---------- Lobby ----------
async function poll(){
 const {data:r,error:e1}=await sb.from('rooms').select('*').eq('id',room).maybeSingle();
 if(!room)return;
 if(e1){$('hint').textContent='Hiba: '+e1.message;return}
 if(!r||Date.now()-new Date(r.updated_at)>30000)return leave('A szoba megszűnt (a host kilépett).');
 const {data:pl,error:e2}=await sb.from('room_players').select('*').eq('room_id',room).order('player_id');
 if(!room)return;
 if(e2){$('hint').textContent='Hiba: '+e2.message;return}
 const act=(pl||[]).filter(p=>Date.now()-new Date(p.last_seen)<25000);
 const mp=act.find(p=>p.player_id==me);
 if(!mp)return leave('Kikerültél a szobából.');
 if(r.status=='playing'&&!G)return startGame(act,r.mode);
 if(r.status=='lobby'&&G)stopGame();
 const tm=r.mode=='team',t0=act.filter(p=>p.team===0).length,t1=act.filter(p=>p.team===1).length;
 $('lt').textContent=`${r.name} · ${tm?'Csapat 3v3':'FFA'} · ${act.length}/6`;
 const line=p=>`<div class=p style="border-color:${p.team===1?'#ff5d5d':p.team===0?'#4da3ff':'#aaa'}">${esc(p.nick)}${p.player_id==r.host_id?' 👑':''}</div>`;
 $('lp').innerHTML=tm?`<div class=cols><div><b style="color:#4da3ff">Kék (${t0}/3)</b>${act.filter(p=>p.team===0).map(line).join('')}</div><div><b style="color:#ff5d5d">Piros (${t1}/3)</b>${act.filter(p=>p.team===1).map(line).join('')}</div></div>`:act.map(line).join('');
 $('note').textContent=note;
 $('sw').style.display=tm?'':'none';
 $('start').style.display=isHost?'':'none';
 const ok=act.length>=2&&(!tm||(act.length%2==0&&t0==t1));
 $('start').disabled=!ok;
 $('hint').textContent=isHost?(act.length<2?'Legalább 2 játékos kell.':tm&&!ok?'Csapatmódban páros létszám és egyenlő csapatok kellenek.':'Indulhat!'):'Várakozás a host indítására…';
}
async function swap(){
 const {data}=await sb.from('room_players').select('team').eq('room_id',room).eq('player_id',me).single();
 const {error}=await sb.rpc('set_team',{p_room:room,p_player:me,p_team:1-data.team});if(error)alert(error.message);poll();
}
async function startReq(){const {error}=await sb.rpc('start_room',{p_room:room,p_host:me});if(error)alert(error.message);else poll()}

// ---------- Játék ----------
function startGame(list,m){
 G=1;mode=m;over=0;note='';tk=0;B=[];SB=[];D=[];R=null;meI=-1;
 ch=sb.channel('g:'+room,{config:{broadcast:{self:false}}});
 ch.on('broadcast',{event:'in'},({payload:p})=>{if(isHost&&P[p.i]){P[p.i].in=p;P[p.i].seen=Date.now()}});
 ch.on('broadcast',{event:'st'},({payload:s})=>{if(!isHost)snap(s)});
 ch.on('broadcast',{event:'end'},({payload:s})=>{note=s.m});
 ch.subscribe(st=>{if(st=='SUBSCRIBED'&&isHost&&!simI)hostInit(list)});
 inI=setInterval(sendIn,66);
 show('game');rs();raf=requestAnimationFrame(draw);
}
function stopGame(){
 clearInterval(simI);clearInterval(inI);simI=0;cancelAnimationFrame(raf);
 if(ch){sb.removeChannel(ch);ch=null}
 const was=G;G=0;if(was&&room){show('lobby');poll()}
}
function sendIn(){
 if(!G||isHost||meI<0)return;
 const s=JSON.stringify(inp);if(s==sendIn.l&&Date.now()-sendIn.t<300)return;
 sendIn.l=s;sendIn.t=Date.now();ch.send({type:'broadcast',event:'in',payload:{i:meI,...inp}});
}

// --- Host szimuláció (a host a "szerver") ---
function hostInit(list){
 R=list.map(p=>({id:p.player_id,n:p.nick,t:p.team}));meI=R.findIndex(r=>r.id==me);
 P=R.map((r,i)=>{const p={t:r.t,k:0,d:0,hp:0,a:0,cd:0,rs:0,seen:Date.now(),in:{u:0,d:0,l:0,r:0,f:0,a:0}};spawn(p);return p});
 D=R.map(()=>({x:0,y:0,tx:0,ty:0,hp:0,a:0,k:0,d:0,first:1}));
 simI=setInterval(tick,33);
}
const wallHit=(x,y,r)=>walls.some(([a,b,w,h])=>x>a-r&&x<a+w+r&&y>b-r&&y<b+h+r);
function spawn(p){
 let x,y,n=0;
 do{x=mode=='team'?(p.t?W-60-Math.random()*240:60+Math.random()*240):60+Math.random()*(W-120);y=60+Math.random()*(H-120)}while(wallHit(x,y,22)&&n++<40);
 Object.assign(p,{x,y,hp:100,cd:.5});
}
function mv(p,dx,dy){const x=Math.min(W-16,Math.max(16,p.x+dx)),y=Math.min(H-16,Math.max(16,p.y+dy));if(!wallHit(x,y,16)){p.x=x;p.y=y}}
function tick(){
 const now=Date.now();
 P.forEach((p,i)=>{
  if(p.gone)return;
  if(i==meI)p.in=inp;else if(now-p.seen>6000){p.gone=1;p.hp=-1;return}
  if(p.hp<=0){if((p.rs-=TICK)<=0)spawn(p);return}
  const q=p.in,dx=(q.r|0)-(q.l|0),dy=(q.d|0)-(q.u|0),m=Math.hypot(dx,dy)||1;
  mv(p,dx/m*230*TICK,0);mv(p,0,dy/m*230*TICK);
  p.a=q.a;p.cd-=TICK;
  if(q.f&&p.cd<=0){p.cd=.16;const a=q.a+(Math.random()-.5)*.08;SB.push({x:p.x+Math.cos(a)*24,y:p.y+Math.sin(a)*24,vx:Math.cos(a)*750,vy:Math.sin(a)*750,o:i,l:.9})}
 });
 for(let j=SB.length-1;j>=0;j--){
  const b=SB[j];b.x+=b.vx*TICK;b.y+=b.vy*TICK;b.l-=TICK;
  let dead=b.l<=0||wallHit(b.x,b.y,2);
  if(!dead)for(let i=0;i<P.length;i++){const p=P[i];
   if(p.hp>0&&i!=b.o&&(mode=='ffa'||p.t!=P[b.o].t)&&Math.hypot(p.x-b.x,p.y-b.y)<17){
    p.hp-=20;dead=1;if(p.hp<=0){p.d++;P[b.o].k++;p.rs=3}break}}
  if(dead)SB.splice(j,1);
 }
 const tot=t=>P.reduce((s,p)=>s+(p.t===t?p.k:0),0);
 if(mode=='ffa'){const w=P.findIndex(p=>p.k>=10);if(w>=0)return fin(R[w].n+' nyert!')}
 else{const w=[0,1].find(t=>tot(t)>=20);if(w!=null)return fin((w?'Piros':'Kék')+' csapat nyert!')}
 if(++tk%2==0)send(tk%80==0||tk==2);
}
function pack(ro){
 const o={p:P.map(p=>[Math.round(p.x),Math.round(p.y),p.hp,+p.a.toFixed(2),p.k,p.d]),b:SB.map(b=>[Math.round(b.x),Math.round(b.y),Math.round(b.vx),Math.round(b.vy)])};
 if(ro)o.ro=R.map(r=>[r.id,r.n,r.t]);return o;
}
function send(ro){const s=pack(ro);snap(s,1);ch.send({type:'broadcast',event:'st',payload:s})}
function fin(m){
 clearInterval(simI);over=1;note=m;send(1);
 ch.send({type:'broadcast',event:'end',payload:{m}});
 sb.rpc('end_room',{p_room:room,p_host:me}).then(()=>{});
}

// --- Kliens: állapot fogadása ---
function snap(s,inst){
 if(s.ro){R=s.ro.map(([id,n,t])=>({id,n,t}));meI=R.findIndex(r=>r.id==me);
  while(D.length<R.length)D.push({x:0,y:0,tx:0,ty:0,hp:0,a:0,k:0,d:0,first:1})}
 if(!R)return;
 s.p.forEach((v,i)=>{const d=D[i];if(!d)return;d.tx=v[0];d.ty=v[1];d.hp=v[2];d.a=v[3];d.k=v[4];d.d=v[5];
  if(inst||d.first||d.hp<=0||Math.hypot(d.x-d.tx,d.y-d.ty)>150){d.x=d.tx;d.y=d.ty;d.first=0}});
 const t=performance.now();B=s.b.map(v=>({x:v[0],y:v[1],vx:v[2],vy:v[3],t}));
}

// --- Rajzolás ---
const cv=$('cv'),cx=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight}
addEventListener('resize',rs);
function col(i){return mode=='team'?(R[i].t?'#ff5d5d':'#4da3ff'):i==meI?'#4da3ff':`hsl(${(i*67+10)%360},75%,60%)`}
function draw(){
 if(!G)return;raf=requestAnimationFrame(draw);
 const w=cv.width,h=cv.height;cx.fillStyle='#10131b';cx.fillRect(0,0,w,h);
 cx.font='bold 20px system-ui';cx.textAlign='center';cx.fillStyle='#e8ecf5';
 if(!R||meI<0){cx.fillText('Csatlakozás a játékhoz…',w/2,h/2);return}
 D.forEach(d=>{if(!isHost){d.x+=(d.tx-d.x)*.35;d.y+=(d.ty-d.y)*.35}});
 const m=D[meI],ox=w/2-m.x,oy=h/2-m.y;
 cx.save();cx.translate(ox,oy);
 cx.fillStyle='#1d2230';cx.fillRect(0,0,W,H);
 cx.strokeStyle='#262d40';cx.lineWidth=1;cx.beginPath();
 for(let x=0;x<=W;x+=100){cx.moveTo(x,0);cx.lineTo(x,H)}for(let y=0;y<=H;y+=100){cx.moveTo(0,y);cx.lineTo(W,y)}cx.stroke();
 cx.strokeStyle='#ff5d5d';cx.lineWidth=4;cx.strokeRect(0,0,W,H);
 cx.fillStyle='#46506b';walls.forEach(([a,b,ww,hh])=>cx.fillRect(a,b,ww,hh));
 const now=performance.now();cx.fillStyle='#ffd24d';
 B.forEach(b=>{const k=(now-b.t)/1000;cx.beginPath();cx.arc(b.x+b.vx*k,b.y+b.vy*k,4,0,7);cx.fill()});
 D.forEach((d,i)=>{if(d.hp<=0)return;
  cx.save();cx.translate(d.x,d.y);cx.rotate(d.a);cx.fillStyle='#8a93ab';cx.fillRect(8,-4,22,8);cx.restore();
  cx.fillStyle=col(i);cx.beginPath();cx.arc(d.x,d.y,16,0,7);cx.fill();cx.strokeStyle='#0008';cx.lineWidth=3;cx.stroke();
  cx.fillStyle='#222';cx.fillRect(d.x-18,d.y-28,36,5);cx.fillStyle='#5dff8a';cx.fillRect(d.x-18,d.y-28,36*d.hp/100,5);
  cx.fillStyle='#fff';cx.font='12px system-ui';cx.fillText(R[i].n,d.x,d.y-34)});
 cx.restore();
 // HUD
 cx.font='bold 14px system-ui';cx.textAlign='right';
 [...D.keys()].sort((a,b)=>D[b].k-D[a].k).forEach((i,j)=>{cx.fillStyle=col(i);cx.fillText(`${R[i].n}  ${D[i].k} / ${D[i].d}`,w-14,24+j*20)});
 cx.textAlign='center';cx.font='bold 22px system-ui';
 if(mode=='team'){const s=[0,1].map(t=>D.reduce((a,d,i)=>a+(R[i].t===t?d.k:0),0));cx.fillStyle='#fff';cx.fillText(`KÉK ${s[0]} – ${s[1]} PIROS  (cél: 20)`,w/2,30)}
 else{cx.fillStyle='#fff';cx.fillText('Cél: 10 kill',w/2,30)}
 if(m.hp<=0){cx.fillStyle='#fff';cx.fillText('Újraéledés…',w/2,h/2)}
 if(note){cx.fillStyle='#ffd24d';cx.font='bold 32px system-ui';cx.fillText(note,w/2,h/2-60)}
}

// --- Bemenet ---
const KM={KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
addEventListener('keydown',e=>{if(G&&KM[e.code])inp[KM[e.code]]=1});
addEventListener('keyup',e=>{if(KM[e.code])inp[KM[e.code]]=0});
addEventListener('mousemove',e=>{inp.a=+Math.atan2(e.clientY-innerHeight/2,e.clientX-innerWidth/2).toFixed(2)});
cv.addEventListener('mousedown',()=>inp.f=1);addEventListener('mouseup',()=>inp.f=0);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('beforeunload',()=>{if(room)sb.rpc('leave_room',{p_room:room,p_player:me}).then(()=>{})});
</script></body></html>
